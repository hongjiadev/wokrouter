name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: WokRouter release tag to verify (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wokrouter-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ""
  CARGO_TERM_COLOR: always
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  OPENAI_API_KEY: ""

jobs:
  release-version:
    name: release-version
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.version.outputs.source_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Derive version from the WokRouter tag
        id: version
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          function Read-ExactUtf8File {
            param(
              [Parameter(Mandatory)][string]$RelativePath,
              [Parameter(Mandatory)][int]$MaximumBytes
            )

            $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
            $workspacePrefix = $workspace.TrimEnd(
              [IO.Path]::DirectorySeparatorChar,
              [IO.Path]::AltDirectorySeparatorChar
            ) + [IO.Path]::DirectorySeparatorChar
            $path = [IO.Path]::GetFullPath(
              [IO.Path]::Combine($workspace, $RelativePath)
            )
            if (-not $path.StartsWith($workspacePrefix, [StringComparison]::Ordinal)) {
              throw "Release source path escapes the checkout: $RelativePath"
            }

            $stream = [IO.File]::Open(
              $path,
              [IO.FileMode]::Open,
              [IO.FileAccess]::Read,
              [IO.FileShare]::Read
            )
            try {
              if ($stream.Length -eq 0 -or $stream.Length -gt $MaximumBytes) {
                throw "Release source file has an invalid size: $RelativePath"
              }
              $bytes = [byte[]]::new([int]$stream.Length)
              $offset = 0
              while ($offset -lt $bytes.Length) {
                $read = $stream.Read($bytes, $offset, $bytes.Length - $offset)
                if ($read -eq 0) {
                  throw "Release source file ended early: $RelativePath"
                }
                $offset += $read
              }
            }
            finally {
              $stream.Dispose()
            }

            try {
              return [Text.UTF8Encoding]::new($false, $true).
                GetString($bytes).
                Replace("`r`n", "`n")
            }
            catch {
              throw "Release source file is not exact UTF-8: $RelativePath"
            }
          }

          function Get-CargoWorkspaceVersion {
            param([Parameter(Mandatory)][string]$Text)

            $sections = @(
              [regex]::Matches(
                $Text,
                '(?ms)^\[workspace\.package\][ \t]*\n(?<body>.*?)(?=^\[[^\r\n]+\][ \t]*$|\z)'
              )
            )
            if ($sections.Count -ne 1) {
              throw "Cargo.toml must contain exactly one [workspace.package] section."
            }
            $versions = @(
              [regex]::Matches(
                $sections[0].Groups["body"].Value,
                '(?m)^version[ \t]*=[ \t]*"(?<value>[^"]+)"[ \t]*$'
              )
            )
            if ($versions.Count -ne 1) {
              throw "Cargo.toml workspace package must contain exactly one version."
            }
            return $versions[0].Groups["value"].Value
          }

          function Get-JsonVersion {
            param(
              [Parameter(Mandatory)][string]$Text,
              [Parameter(Mandatory)][string]$Name
            )

            $document = [Text.Json.JsonDocument]::Parse($Text)
            try {
              if (
                $document.RootElement.ValueKind -ne
                [Text.Json.JsonValueKind]::Object
              ) {
                throw "$Name must contain one JSON object."
              }
              $members = @(
                $document.RootElement.EnumerateObject() |
                  Where-Object { $_.Name -ieq "version" }
              )
              if (
                $members.Count -ne 1 -or
                $members[0].Name -cne "version" -or
                $members[0].Value.ValueKind -ne
                [Text.Json.JsonValueKind]::String
              ) {
                throw "$Name must contain one exact string version member."
              }
              return $members[0].Value.GetString()
            }
            finally {
              $document.Dispose()
            }
          }

          function Get-LockPackageVersions {
            param([Parameter(Mandatory)][string]$Text)

            $wanted = @(
              "wokrouter-cli",
              "wokrouter-desktop",
              "wokrouter-platform",
              "wokrouter-storage",
              "wokrouter-wokcore-client"
            )
            $blocks = @(
              [regex]::Matches(
                $Text,
                '(?ms)^\[\[package\]\][ \t]*\n.*?(?=^\[\[package\]\][ \t]*$|\z)'
              )
            )
            $versions = [System.Collections.Generic.List[string]]::new()
            foreach ($packageName in $wanted) {
              $matching = @(
                $blocks |
                  Where-Object {
                    $_.Value -match (
                      '(?m)^name[ \t]*=[ \t]*"' +
                      [regex]::Escape($packageName) +
                      '"[ \t]*$'
                    )
                  }
              )
              if ($matching.Count -ne 1) {
                throw "Cargo.lock must contain exactly one '$packageName' package."
              }
              $version = @(
                [regex]::Matches(
                  $matching[0].Value,
                  '(?m)^version[ \t]*=[ \t]*"(?<value>[^"]+)"[ \t]*$'
                )
              )
              if ($version.Count -ne 1) {
                throw "Cargo.lock package '$packageName' must contain exactly one version."
              }
              $versions.Add($version[0].Groups["value"].Value)
            }
            return $versions.ToArray()
          }

          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $env:DISPATCH_TAG
          } else {
            $env:PUSH_TAG
          }
          if ($tag -notmatch '^v(?<version>0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must be a canonical WokRouter semver tag: $tag"
          }
          $sourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') {
            throw "Unable to resolve the requested WokRouter tag commit."
          }
          $tagVersion = $tag.Substring(1)
          [string[]]$sourceVersions = @(
            Get-CargoWorkspaceVersion -Text (
              Read-ExactUtf8File -RelativePath "Cargo.toml" -MaximumBytes 131072
            )
            Get-JsonVersion `
              -Text (
                Read-ExactUtf8File `
                  -RelativePath "apps/desktop/package.json" `
                  -MaximumBytes 262144
              ) `
              -Name "apps/desktop/package.json"
            Get-JsonVersion `
              -Text (
                Read-ExactUtf8File `
                  -RelativePath "apps/desktop/src-tauri/tauri.conf.json" `
                  -MaximumBytes 262144
              ) `
              -Name "apps/desktop/src-tauri/tauri.conf.json"
            Get-LockPackageVersions -Text (
              Read-ExactUtf8File -RelativePath "Cargo.lock" -MaximumBytes 8388608
            )
          )
          if ($sourceVersions.Count -ne 8) {
            throw "WokRouter release must validate exactly eight source versions."
          }
          foreach ($sourceVersion in $sourceVersions) {
            if ($sourceVersion -cne $tagVersion) {
              throw "WokRouter source version does not match release tag."
            }
          }
          "source_sha=$sourceSha" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$tagVersion" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  release-build:
    name: release (${{ matrix.target }})
    needs: release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      WOKROUTER_BUNDLE_KIND: online
      WOKROUTER_RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
      WOKROUTER_RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
      WOKROUTER_TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.release-version.outputs.source_sha }}
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cpio \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            rpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
      - name: Install Visual C++ ARM64 tools
        if: runner.os == 'Windows' && matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $installerDirectory = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer"
          $installer = Join-Path $installerDirectory "vs_installer.exe"
          $vswhere = Join-Path $installerDirectory "vswhere.exe"
          $installationPath = (& $vswhere -latest -products * -property installationPath).Trim()
          if (
            -not (Test-Path -LiteralPath $installer -PathType Leaf) -or
            [string]::IsNullOrWhiteSpace($installationPath)
          ) {
            throw "Visual Studio Installer could not be resolved."
          }
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "modify",
              "--installPath",
              "`"$installationPath`"",
              "--add",
              "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
              "--quiet",
              "--norestart"
            ) `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Visual C++ ARM64 tools installation failed: $($process.ExitCode)"
          }
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Configure target-specific online bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target -Force | Out-Null
          @{ version = $env:WOKROUTER_RELEASE_VERSION } |
            ConvertTo-Json -Compress |
            Set-Content -LiteralPath target/wokrouter-release-config.json -Encoding utf8
      - name: Build Linux bundles
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          pnpm --dir apps/desktop tauri build `
            --target $env:WOKROUTER_TARGET_TRIPLE `
            --bundles appimage,deb,rpm `
            --config ../../target/wokrouter-release-config.json
      - name: Build macOS bundles
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          pnpm --dir apps/desktop tauri build `
            --target $env:WOKROUTER_TARGET_TRIPLE `
            --bundles app,dmg `
            --config ../../target/wokrouter-release-config.json
      - name: Build Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm --dir apps/desktop tauri build `
            --target $env:WOKROUTER_TARGET_TRIPLE `
            --bundles msi `
            --config ../../target/wokrouter-release-config.json
      - name: Package normalized Linux payloads
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $tauriBundle = Join-Path target "$env:WOKROUTER_TARGET_TRIPLE/release/bundle"
          $output = Join-Path target "wokrouter-public-$env:WOKROUTER_TARGET_TRIPLE"
          & tests/release/package-linux-assets.ps1 `
            -BundleDirectory $tauriBundle `
            -OutputDirectory $output `
            -Version $env:WOKROUTER_RELEASE_VERSION `
            -Target $env:WOKROUTER_TARGET_TRIPLE
      - name: Package normalized macOS payloads
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $tauriBundle = Join-Path target "$env:WOKROUTER_TARGET_TRIPLE/release/bundle"
          $output = Join-Path target "wokrouter-public-$env:WOKROUTER_TARGET_TRIPLE"
          & tests/release/package-macos-assets.ps1 `
            -BundleDirectory $tauriBundle `
            -OutputDirectory $output `
            -Version $env:WOKROUTER_RELEASE_VERSION `
            -Target $env:WOKROUTER_TARGET_TRIPLE
      - name: Package normalized Windows payloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseRoot = Join-Path target "$env:WOKROUTER_TARGET_TRIPLE/release"
          $tauriBundle = Join-Path $releaseRoot "bundle"
          $desktop = Join-Path $releaseRoot "wokrouter-desktop.exe"
          $sidecar = Join-Path $releaseRoot "wokrouter.exe"
          $output = Join-Path target "wokrouter-public-$env:WOKROUTER_TARGET_TRIPLE"
          & tests/release/package-windows-assets.ps1 `
            -BundleDirectory $tauriBundle `
            -DesktopExecutable $desktop `
            -SidecarExecutable $sidecar `
            -RepositoryRoot $PWD `
            -OutputDirectory $output `
            -Version $env:WOKROUTER_RELEASE_VERSION `
            -Target $env:WOKROUTER_TARGET_TRIPLE
      - uses: actions/upload-artifact@v6
        with:
          name: wokrouter-payload-${{ matrix.target }}
          path: target/wokrouter-public-${{ matrix.target }}/*
          if-no-files-found: error

  release-compatibility:
    name: release-compatibility
    needs: release-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.release-version.outputs.source_sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
      - name: Current WokCore
        run: cargo test -p wokrouter-wokcore-client --test handshake current_wokrouter_accepts_current_wokcore --locked
      - name: Newer same-major WokCore
        run: cargo test -p wokrouter-wokcore-client --test handshake compatible_handshake_accepts_unknown_same_major_fields --locked
      - name: Older same-major WokCore
        run: cargo test -p wokrouter-wokcore-client --test handshake legacy_same_major_runtime_without_installation_id_remains_running --locked
      - name: Non-overlapping management API
        run: cargo test -p wokrouter-wokcore-client --test handshake non_overlapping_api_major_is_incompatible_without_http_fallback --locked
      - name: WokRouter update does not overwrite WokCore
        run: cargo test -p wokrouter-platform --features test-support --test wokcore_install an_existing_compatible_install_is_never_overwritten --locked
      - name: WokCore install does not modify WokRouter
        run: cargo test -p wokrouter-platform --features test-support --test wokcore_install installing_wokcore_does_not_modify_wokrouter_binary_or_version --locked
      - name: Prefer a valid signed WokCore v2 release
        run: cargo test -p wokrouter-platform --features test-support --test wokcore_install wokcore_install_prefers_a_valid_signed_v2_release_without_requesting_v1 --locked
      - name: Fall back when the WokCore v2 manifest is missing
        run: cargo test -p wokrouter-platform --features test-support --test wokcore_install wokcore_install_missing_v2_manifest_falls_back_to_the_signed_v1_release --locked
      - name: Never downgrade from a present invalid WokCore v2 manifest
        run: cargo test -p wokrouter-platform --features test-support --test wokcore_install wokcore_install_present_invalid_v2_manifest_never_downgrades_to_v1 --locked
      - name: Reject a WokCore v1 schema served from the v2 endpoint
        run: cargo test -p wokrouter-platform --features test-support --test wokcore_install wokcore_install_rejects_a_signed_v1_schema_at_the_v2_endpoint_without_downgrading --locked

  release-assemble:
    name: release-assemble
    needs:
      - release-version
      - release-build
      - release-compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.release-version.outputs.source_sha }}
      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
      - name: Prepare clean payload directory
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath dist) {
            throw "The payload directory must start absent."
          }
          New-Item -ItemType Directory -Path dist | Out-Null
      - uses: actions/download-artifact@v7
        with:
          pattern: wokrouter-payload-*
          path: dist
          merge-multiple: true
      - name: Require the exact unsigned payload inventory
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          Import-Module tests/release/WokRouter.ReleaseContract.psm1 -Force
          [string[]] $expected = @(
            Get-WokRouterPayloadNames -Version $env:RELEASE_VERSION
          )
          $items = @(Get-ChildItem -LiteralPath dist -Force)
          if (
            $items.Count -ne 16 -or
            @(
              $items | Where-Object {
                $_.PSIsContainer -or
                ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
              }
            ).Count -ne 0
          ) {
            throw "Expected exactly 16 regular WokRouter payloads."
          }
          [string[]] $actual = @($items | ForEach-Object Name)
          [Array]::Sort($actual, [StringComparer]::Ordinal)
          if (
            [string]::Join("`n", $actual) -cne
            [string]::Join("`n", $expected)
          ) {
            throw "Unsigned WokRouter payload inventory does not match."
          }
      - name: Sign and locally verify the release bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
          WOKROUTER_MINISIGN_SECRET_KEY: ${{ secrets.WOKROUTER_MINISIGN_SECRET_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WOKROUTER_MINISIGN_SECRET_KEY)) {
            throw "WOKROUTER_MINISIGN_SECRET_KEY must not be empty."
          }
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $secretPath = [IO.Path]::GetFullPath(
            (Join-Path $runnerTemp "wokrouter-minisign.key")
          )
          if (
            (Split-Path -Parent $secretPath) -cne $runnerTemp -or
            (Split-Path -Leaf $secretPath) -cne "wokrouter-minisign.key" -or
            (Test-Path -LiteralPath $secretPath)
          ) {
            throw "The temporary Minisign key path is not clean and exact."
          }
          try {
            [IO.File]::WriteAllText(
              $secretPath,
              $env:WOKROUTER_MINISIGN_SECRET_KEY,
              [Text.UTF8Encoding]::new($false)
            )
            & tests/release/sign-release-bundle.ps1 `
              -ArtifactDirectory dist `
              -Version $env:RELEASE_VERSION `
              -SecretKeyPath $secretPath `
              -PublicKeyPath release/minisign.pub `
              -MinisignPath (Get-Command minisign).Source
            & tests/release/verify-release-bundle.ps1 `
              -ArtifactDirectory dist `
              -Version $env:RELEASE_VERSION `
              -PublicKeyPath release/minisign.pub `
              -MinisignPath (Get-Command minisign).Source
          }
          finally {
            if (Test-Path -LiteralPath $secretPath -PathType Leaf) {
              try {
                $length = (Get-Item -LiteralPath $secretPath).Length
                [IO.File]::WriteAllBytes(
                  $secretPath,
                  [byte[]]::new($length)
                )
              }
              finally {
                Remove-Item -LiteralPath $secretPath -Force
              }
            }
            if (Test-Path -LiteralPath $secretPath) {
              throw "The temporary Minisign key was not removed."
            }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: wokrouter-${{ needs.release-version.outputs.tag }}-signed
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - release-version
      - release-assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.release-version.outputs.source_sha }}
      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
      - name: Prepare clean signed bundle directory
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath dist) {
            throw "The signed bundle directory must start absent."
          }
          New-Item -ItemType Directory -Path dist | Out-Null
      - uses: actions/download-artifact@v7
        with:
          name: wokrouter-${{ needs.release-version.outputs.tag }}-signed
          path: dist
      - name: Verify the signed bundle before release mutation
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          & tests/release/verify-release-bundle.ps1 `
            -ArtifactDirectory dist `
            -Version $env:RELEASE_VERSION `
            -PublicKeyPath release/minisign.pub `
            -MinisignPath (Get-Command minisign).Source
      - name: Publish one verified draft transaction
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
          SOURCE_SHA: ${{ needs.release-version.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_remote_tag_commit() {
            local response object_type object_sha depth
            response="$(
              gh api \
                --method GET \
                --header "Accept: application/vnd.github+json" \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
            )"
            object_type="$(
              jq -er \
                '.object.type | select(type == "string" and (. == "commit" or . == "tag"))' \
                <<<"$response"
            )"
            object_sha="$(
              jq -er \
                '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
                <<<"$response"
            )"
            depth=0
            while [[ "$object_type" == "tag" ]]; do
              if (( depth >= 8 )); then
                echo "Remote WokRouter annotated tag chain is too deep." >&2
                return 1
              fi
              depth=$((depth + 1))
              response="$(
                gh api \
                  --method GET \
                  --header "Accept: application/vnd.github+json" \
                  "repos/$GITHUB_REPOSITORY/git/tags/$object_sha"
              )"
              object_type="$(
                jq -er \
                  '.object.type | select(type == "string" and (. == "commit" or . == "tag"))' \
                  <<<"$response"
              )"
              object_sha="$(
                jq -er \
                  '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
                  <<<"$response"
              )"
            done
            if [[ "$object_type" != "commit" ]]; then
              echo "Remote WokRouter tag does not resolve to a commit." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }
          require_remote_tag_commit() {
            local remote_sha
            remote_sha="$(resolve_remote_tag_commit)"
            if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
              echo "Remote WokRouter tag commit does not match source SHA." >&2
              return 1
            fi
          }
          release_mutation_started=false
          begin_release_mutation() {
            if [[ "$release_mutation_started" == "false" ]]; then
              require_remote_tag_commit
              release_mutation_started=true
            fi
          }
          error_file="$RUNNER_TEMP/wokrouter-release-view-error"
          if existing="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,tagName 2>"$error_file"
          )"; then
            if [[ "$(jq -r '.isDraft' <<<"$existing")" != "true" ]]; then
              echo "An existing public WokRouter release is immutable." >&2
              exit 1
            fi
            if [[ "$(jq -r '.tagName' <<<"$existing")" != "$RELEASE_TAG" ]]; then
              echo "The existing draft tag does not match." >&2
              exit 1
            fi
          else
            if ! grep -Eq 'release not found|HTTP 404' "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
            begin_release_mutation
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "WokRouter $RELEASE_TAG" \
              --generate-notes
          fi

          mapfile -t existing_assets < <(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )
          for asset in "${existing_assets[@]}"; do
            if [[ "$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft \
                --jq '.isDraft'
            )" != "true" ]]; then
              echo "The WokRouter draft became public before asset cleanup." >&2
              exit 1
            fi
            begin_release_mutation
            gh release delete-asset "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          done

          mapfile -t local_assets < <(
            find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          if [[ "${#local_assets[@]}" -ne 35 ]]; then
            echo "Expected exactly 35 signed WokRouter assets." >&2
            exit 1
          fi
          if [[ "$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft'
          )" != "true" ]]; then
            echo "The WokRouter draft became public before upload." >&2
            exit 1
          fi
          begin_release_mutation
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY"

          remote="$RUNNER_TEMP/wokrouter-remote-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -e "$remote" ]]; then
            echo "The remote verification directory must start absent." >&2
            exit 1
          fi
          mkdir "$remote"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$remote"
          pwsh tests/release/verify-release-bundle.ps1 \
            -ArtifactDirectory "$remote" \
            -Version "$RELEASE_VERSION" \
            -PublicKeyPath release/minisign.pub \
            -MinisignPath "$(command -v minisign)"
          require_remote_tag_commit
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
