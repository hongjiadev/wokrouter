[workspace]
resolver = "2"
members = [
  "crates/wokrouter-storage",
  "crates/wokrouter-platform",
  "crates/wokrouter-wokcore-client",
  "apps/cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.16"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
bytes = "1.12.1"
flate2 = "1.1.9"
futures = "0.3.33"
fs4 = "0.13"
jiff = "0.2.34"
keyring = "4.1.5"
minisign-verify = "0.2.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
secrecy = "0.10.3"
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sys-locale = "0.3"
tar = { version = "0.4.46", default-features = false }
tauri = "2.11.5"
tauri-build = "2.6.3"
tempfile = "3"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = { version = "0.25", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
wiremock = "0.6.5"
zeroize = "1.9.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
