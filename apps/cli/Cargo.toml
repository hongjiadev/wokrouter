[package]
name = "wokrouter-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "wokrouter"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
secrecy.workspace = true
semver = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
wokrouter-platform = { path = "../../crates/wokrouter-platform" }
wokrouter-storage = { path = "../../crates/wokrouter-storage" }
wokrouter-wokcore-client = { path = "../../crates/wokrouter-wokcore-client" }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
wokrouter-platform = { path = "../../crates/wokrouter-platform", features = ["test-support"] }
